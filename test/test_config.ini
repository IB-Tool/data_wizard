; Local test configuration for Data Wizard (UTF-8).
;
; [qgis] is only consulted for local runs; the Docker image sets
; QGIS_PREFIX_PATH=/usr itself.
;
; [testdata] declares the layout of the committed Testdaten/ folder. This is
; the single place where those paths are defined - test/config.py reads them
; and test modules import the resulting constants from there.

[qgis]
prefix_path = C:\\Program Files\\QGIS 3.40.0

[testdata]
dir = Testdaten
atkis_subdir = ATKIS Basis DLM dataset
hu_file = ALKIS Gebäude/GebauedeBauwerk.shp
